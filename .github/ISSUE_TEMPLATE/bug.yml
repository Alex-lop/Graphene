name: Something is wrong
description: A command failed, printed the wrong thing, or let through what the page says it holds.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `graphene --version`.
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, and the agent you used with it (Claude Code, Codex, or a command).
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw, and what you expected
    validations:
      required: true
