name: CI

on:
  push:
    branches: [main]  # a pull request's commits build once, as the pull request
  pull_request:

concurrency:  # a new push to a pull request cancels its earlier run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run pytest -q -n auto
      - run: uv build
      - name: Smoke the wheel outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          uv venv smoke
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          ./smoke/bin/graphene --version
          ./smoke/bin/graphene demo --once   # the replay a judge with no key runs: from the wheel alone

