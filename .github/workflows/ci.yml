name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke the wheel outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          uv venv smoke
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          ./smoke/bin/graphene --version

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci --prefix ui
      - run: npm --prefix ui run check
      - name: The committed page is what the source builds
        run: git diff --exit-code -- src/graphene_map/ui/static
