<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The loop: you shape the plan, your agents work inside it, Graphene holds the edges">
  <title>The loop: you, the plan, your agents</title>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #141413; }
    .box { fill: none; stroke: #141413; stroke-width: 2; }
    .line { stroke: #141413; stroke-width: 2; fill: none; }
    .big { font-size: 30px; }
    .label { font-size: 21px; }
    .arrow { font-size: 17px; }
    .small { font-size: 19px; fill: #5E5D59; }
    .glyph { font-size: 56px; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141413"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F0EEE6"/>

  <!-- you -->
  <rect class="box" x="30" y="230" width="220" height="215" rx="6"/>
  <text class="glyph" x="140" y="330" text-anchor="middle">&gt;_</text>
  <text class="big" x="140" y="415" text-anchor="middle">you</text>

  <!-- the plan: the mark's tree, one branch pruned -->
  <rect class="box" x="460" y="150" width="280" height="375" rx="6"/>
  <g transform="translate(498 178) scale(3.2)" fill="#141413">
    <path fill-rule="evenodd" d="M48.9 29.47C50.56 29.47 51.9 30.81 51.9 32.47C51.9 34.13 50.56 35.47 48.9 35.47C47.23 35.47 45.89 34.13 45.89 32.47C45.89 30.81 47.23 29.47 48.9 29.47ZM48.9 30.5C47.81 30.5 46.92 31.38 46.92 32.47C46.92 33.56 47.81 34.44 48.9 34.44C49.98 34.44 50.87 33.56 50.87 32.47C50.87 31.38 49.98 30.5 48.9 30.5ZM48.9 51.99C50.56 51.99 51.9 53.34 51.9 55C51.9 56.66 50.56 58 48.9 58C47.23 58 45.89 56.66 45.89 55C45.89 53.34 47.23 51.99 48.9 51.99ZM48.9 53.03C47.81 53.03 46.92 53.91 46.92 55C46.92 56.09 47.81 56.97 48.9 56.97C49.98 56.97 50.87 56.09 50.87 55C50.87 53.91 49.98 53.03 48.9 53.03Z"/>
    <path d="M29.2 14.57C26.7 20.79 20.14 20.29 19.94 28.06L21.53 28.06C21.34 21.33 27.73 22.01 30.68 15.19ZM32.33 15.34C33.77 21.97 36.9 21.29 36.83 28.06L38.43 28.06C38.36 20.65 35.14 21.14 33.89 15.01ZM19.05 36.62C17.69 43.22 14.37 42.69 14.31 50.58L15.9 50.58C15.84 43.3 19.07 44.01 20.61 36.95ZM20.87 36.95C22.41 44.01 25.64 43.3 25.57 50.58L27.17 50.58C27.1 42.69 23.79 43.22 22.43 36.62ZM36.83 36.88C36.83 43.67 36.83 43.05 36.83 50.58L38.43 50.58C38.43 43.05 38.43 43.67 38.43 36.88ZM15.1 51.99C16.77 51.99 18.11 53.34 18.11 55C18.11 56.66 16.77 58 15.1 58C13.44 58 12.1 56.66 12.1 55C12.1 53.34 13.44 51.99 15.1 51.99ZM26.37 51.99C28.03 51.99 29.37 53.34 29.37 55C29.37 56.66 28.03 58 26.37 58C24.71 58 23.36 56.66 23.36 55C23.36 53.34 24.71 51.99 26.37 51.99ZM37.63 51.99C39.29 51.99 40.64 53.34 40.64 55C40.64 56.66 39.29 58 37.63 58C35.97 58 34.63 56.66 34.63 55C34.63 53.34 35.97 51.99 37.63 51.99ZM20.74 29.47C22.4 29.47 23.74 30.81 23.74 32.47C23.74 34.13 22.4 35.47 20.74 35.47C19.08 35.47 17.73 34.13 17.73 32.47C17.73 30.81 19.08 29.47 20.74 29.47ZM37.63 29.47C39.29 29.47 40.64 30.81 40.64 32.47C40.64 34.13 39.29 35.47 37.63 35.47C35.97 35.47 34.63 34.13 34.63 32.47C34.63 30.81 35.97 29.47 37.63 29.47ZM32 6C34.18 6 35.94 7.76 35.94 9.94C35.94 12.12 34.18 13.88 32 13.88C29.82 13.88 28.06 12.12 28.06 9.94C28.06 7.76 29.82 6 32 6Z"/>
  </g>
  <text class="big" x="600" y="492" text-anchor="middle">the plan</text>

  <!-- what Graphene holds, written on the plan's edge -->
  <text class="small" x="600" y="562" text-anchor="middle">scope: a write anywhere else is refused before it happens</text>
  <text class="small" x="600" y="590" text-anchor="middle">check: Graphene runs it, in a clean worktree</text>
  <text class="small" x="600" y="618" text-anchor="middle">red first: a check that already passes is flagged</text>
  <text class="small" x="600" y="646" text-anchor="middle">done: git says what changed, and what landed</text>

  <!-- your agents -->
  <rect class="box" x="950" y="230" width="220" height="215" rx="6"/>
  <rect class="box" x="982" y="268" width="156" height="54" rx="4"/>
  <text class="label" x="1060" y="304" text-anchor="middle">&gt;_</text>
  <rect class="box" x="982" y="334" width="156" height="54" rx="4"/>
  <text class="label" x="1060" y="370" text-anchor="middle">&gt;_</text>
  <text class="big" x="1060" y="425" text-anchor="middle">your agents</text>

  <!-- the arrows -->
  <line class="line" x1="250" y1="300" x2="458" y2="300" marker-end="url(#head)"/>
  <text class="arrow" x="355" y="286" text-anchor="middle">accept, prune, run</text>
  <line class="line" x1="460" y1="380" x2="252" y2="380" marker-end="url(#head)"/>
  <text class="arrow" x="355" y="408" text-anchor="middle">what landed,</text>
  <text class="arrow" x="355" y="430" text-anchor="middle">what it cost</text>
  <line class="line" x1="950" y1="300" x2="742" y2="300" marker-end="url(#head)"/>
  <text class="arrow" x="845" y="286" text-anchor="middle">propose, do, done</text>
  <line class="line" x1="740" y1="380" x2="948" y2="380" marker-end="url(#head)"/>
  <text class="arrow" x="845" y="408" text-anchor="middle">a task: its files,</text>
  <text class="arrow" x="845" y="430" text-anchor="middle">its check</text>

  <text class="small" x="600" y="78" text-anchor="middle">You shape the plan. Your agents work inside it. Graphene holds the edges.</text>
</svg>
