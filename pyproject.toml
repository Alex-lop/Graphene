[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene-debrief"
version = "0.1.0"
description = "Tells you what your coding agent did, and why, grouped by what you asked for."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.15",
  "rich>=13",
]

[project.scripts]
graphene = "graphene_debrief.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphene_debrief"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option() in defaults is the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
