[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene"
version = "0.2.0"
description = "Local-first mission control for bounded multi-agent coding work"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk==2.5.0",
  "google-auth>=2.56,<3",
  "google-cloud-firestore==2.28.0",
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "textual>=8.2.8,<9",
  "uvicorn>=0.35,<1",
]

[project.scripts]
graphene = "graphene.cli.main:main"
graphene-mcp = "graphene.integrations.stdio:main"

[dependency-groups]
# Pinned, not floating: scripts/morning_verify.sh and CI both run these, and a
# claim that only reproduces on a machine with an ambient linter is not a claim.
dev = ["pytest>=8,<10", "pytest-timeout==2.4.0", "ruff==0.12.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend/graphene"]

[tool.hatch.build.targets.wheel.force-include]
"demo/taskmaster" = "graphene/_taskmaster"

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/All_md_Files"]

[tool.pytest.ini_options]
# faulthandler dumps every thread's stack at 180s so a hang leaves a diagnostic,
# and pytest-timeout hard-kills at 600s with `thread` rather than the default
# `signal`: this suite's hangs park worker threads in SQLite C calls, a signal
# reaches only the main thread, and ThreadPoolExecutor shutdown then joins
# those threads with no timeout — so os._exit is what actually ends the run.
# Captured stacks show those threads in __psynch_mutexwait inside libsqlite3's
# unix VFS (unixOpen/findReusableFd on open, sqlite3WalClose/unixLock on
# close). No SQLite timeout setting bounds that: connect(timeout=) and
# busy_timeout configure the busy handler, which is a layer above it. See the
# "Full-matrix hang under load" row in docs/KNOWN_LIMITATIONS.md.
#
# What `timeout` below does NOT cover: pytest-timeout arms per test item and
# disarms on the way out, so a wedge that lands after the last item has
# finished is unguarded. It bounds a test that hangs, not a shutdown that
# hangs.
addopts = "-ra"
faulthandler_timeout = 180
timeout = 600
timeout_method = "thread"
pythonpath = ["backend", "."]
testpaths = ["tests"]
