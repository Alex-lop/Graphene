[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene"
version = "0.2.0"
description = "Local-first mission control for bounded multi-agent coding work"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk==2.5.0",
  "google-cloud-firestore==2.28.0",
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
graphene = "graphene.cli.main:main"
graphene-mcp = "graphene.integrations.stdio:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["backend/graphene"]

[tool.hatch.build.targets.wheel.force-include]
"demo/taskmaster" = "graphene/_taskmaster"

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/All_md_Files"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend", "."]
testpaths = ["tests"]
