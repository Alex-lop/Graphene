[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene"
version = "0.2.0"
description = "Local-first mission control for bounded multi-agent coding work"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk==2.5.0",
  "google-auth>=2.56,<3",
  "google-cloud-firestore==2.28.0",
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "uvicorn>=0.35,<1",
]

[project.scripts]
graphene = "graphene.cli.main:main"
graphene-mcp = "graphene.integrations.stdio:main"

[dependency-groups]
# Pinned, not floating: scripts/morning_verify.sh and CI both run these, and a
# claim that only reproduces on a machine with an ambient linter is not a claim.
dev = ["pytest>=8,<10", "pytest-timeout==2.4.0", "ruff==0.12.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend/graphene"]

[tool.hatch.build.targets.wheel.force-include]
"demo/taskmaster" = "graphene/_taskmaster"

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/All_md_Files"]

[tool.pytest.ini_options]
# faulthandler dumps every thread's stack at 180s so a hang leaves a diagnostic.
# pytest-timeout then hard-kills at 600s: `thread` (not the default `signal`)
# because the hangs this suite produces are worker threads blocked in SQLite C
# calls — a signal reaches the main thread but ThreadPoolExecutor shutdown then
# waits on those threads forever, so only os._exit actually ends the run.
addopts = "-ra"
faulthandler_timeout = 180
timeout = 600
timeout_method = "thread"
pythonpath = ["backend", "."]
testpaths = ["tests"]
