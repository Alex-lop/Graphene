[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewlatch"
version = "0.1.0"
description = "Approved repository-scoped memory for a controlled coding workflow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk==2.5.0",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["backend/reviewlatch"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend"]
testpaths = ["tests"]
