[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene-debrief"
version = "0.1.0"
description = "Why did my coding agent change this line? Intent-blame for code written by Claude Code, across sessions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Alex Lopez", email = "alexlp2024@gmail.com" },
]
keywords = ["claude-code", "coding-agents", "git", "blame", "debrief", "cli", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.15",
  "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Alex-lop/Graphene"
Repository = "https://github.com/Alex-lop/Graphene"
Issues = "https://github.com/Alex-lop/Graphene/issues"
Changelog = "https://github.com/Alex-lop/Graphene/blob/main/CHANGELOG.md"

[project.scripts]
graphene = "graphene_debrief.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphene_debrief"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option() in defaults is the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
