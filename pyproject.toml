[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphene-map"
version = "0.7.0"
description = "Keep Claude Code and Codex inside the files you agreed to, and call a change done only when your tests pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Alex Lopez", email = "alexlp2024@gmail.com" },
]
keywords = ["claude-code", "coding-agents", "ai-agents", "codex", "plan", "git", "hooks", "cli", "nemotron",
            "nvidia", "token-factory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.15",
  "rich>=13",
  "textual>=8.2",
]

[project.optional-dependencies]
# Nemotron on Token Factory, in src/graphene_map/nemotron/. Sandboxes (ConTree) are in beta: pinned, and
# spoken to only in nemotron/sandbox.py
nemotron = ["contree-sdk==0.3.6"]

[project.urls]
Homepage = "https://github.com/Alex-lop/Graphene"
Repository = "https://github.com/Alex-lop/Graphene"
Issues = "https://github.com/Alex-lop/Graphene/issues"
Changelog = "https://github.com/Alex-lop/Graphene/blob/main/CHANGELOG.md"

[project.scripts]
graphene = "graphene_map.cli:app"
graphene-map = "graphene_map.cli:app"  # so `uvx graphene-map demo` runs

[dependency-groups]
dev = [
  "graphene-map[nemotron]",  # the tests cover the extra: `uv run pytest` installs it
  "pytest>=8",
  "pytest-xdist>=3.6",  # CI runs the suite with -n auto
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphene_map"]

[tool.hatch.build.targets.sdist]
# the VS Code extension's sources ship in the sdist; what npm and vsce build there never does
exclude = ["editors/vscode/node_modules", "editors/vscode/out", "editors/vscode/dist", "editors/vscode/*.vsix"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["editors"]  # TypeScript and node_modules: not Python's to lint

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option() in defaults is the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests", "dev/test", "dev/held/test_held.py", "dev/held/test_tasks.py"]  # the files, not dev/held: its tasks hold fixture repos with their own tests
norecursedirs = ["*.egg", ".*", "build", "dist", "node_modules", "venv", "editors"]  # the defaults, and the editors' own test suites
