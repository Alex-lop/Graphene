<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__GRAPHENE_TITLE__</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #16171b;
  --muted: #6b7280;
  --line: #e6e7eb;
  --card: #fbfbfc;
  --chip: #f2f3f5;
  --accent: #4f46e5;
  --add: #0f7b3d;
  --del: #b3261e;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --fg: #e9eaee;
    --muted: #979da8;
    --line: #2a2c32;
    --card: #17181c;
    --chip: #1e2025;
    --accent: #99a3ff;
    --add: #56c47f;
    --del: #ff8078;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 120px; }
body.panel-open .wrap { max-width: none; margin: 0; padding-right: min(560px, 46vw); }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
     color: var(--muted); margin: 48px 0 16px; }
p { margin: 0 0 6px; }
.muted { color: var(--muted); }
.add { color: var(--add); }
.del { color: var(--del); }
.sep { color: var(--line); padding: 0 2px; }

/* header ---------------------------------------------------------------- */
.totals { font-size: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline;
          margin-top: 14px; }
.totals .big { font-size: 17px; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.fail { color: var(--muted); font-size: 13px; margin-top: 6px; }
details.commits { margin-top: 14px; font-size: 13px; }
details.commits summary { cursor: pointer; color: var(--accent); width: fit-content; }
details.commits ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
details.commits li { font-family: var(--mono); font-size: 12px; }

/* filters --------------------------------------------------------------- */
.filters { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; padding-top: 16px;
           border-top: 1px solid var(--line); font-size: 13px; }
.filters label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer;
                 color: var(--muted); }
.filters input { accent-color: var(--accent); }
.filters .count { margin-left: auto; color: var(--muted); }

/* session bands --------------------------------------------------------- */
.bands { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.band { flex: 1 1 260px; border: 1px solid var(--line); border-top: 2px solid var(--accent);
        border-radius: 6px; background: var(--card); padding: 12px 14px; }
.band .band-id { font-family: var(--mono); font-size: 13px; }
.band .band-line { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }

/* timeline -------------------------------------------------------------- */
.row { position: relative; padding: 0 0 34px 26px; border-left: 1px solid var(--line); }
.row:last-child { border-left-color: transparent; }
.row::before { content: ""; position: absolute; left: -4px; top: 7px; width: 7px; height: 7px;
               border-radius: 50%; background: var(--line); }
.row.has-flag::before { background: var(--accent); }
.row.flash { background: var(--card); border-radius: 6px; }
.row-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline;
            font-size: 12px; color: var(--muted); }
.row-head .ord { font-weight: 600; color: var(--fg); font-size: 13px; }
.prompt-text { margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
               overflow: hidden; }
.prompt-text.open { display: block; }
.files { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.chip { display: inline-flex; flex-wrap: wrap; gap: 7px; align-items: baseline;
        font: inherit; font-size: 13px; color: var(--fg); background: var(--chip);
        border: 1px solid transparent; border-radius: 5px; padding: 3px 9px; cursor: pointer;
        text-align: left; }
.chip:hover, .chip:focus-visible { border-color: var(--accent); outline: none; }
.chip .dir { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip .name { font-family: var(--mono); font-size: 12px; }
.chip .effect { color: var(--muted); font-size: 12px; }
.chip .flag { color: var(--accent); font-size: 12px; }

/* panel ----------------------------------------------------------------- */
.panel { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 92vw);
         overflow-y: auto; background: var(--bg); border-left: 1px solid var(--line);
         padding: 28px 26px 80px; }
.panel[hidden] { display: none; }
.panel .close { float: right; font: inherit; font-size: 13px; color: var(--muted);
                background: none; border: 0; cursor: pointer; padding: 2px 4px; }
.panel .close:hover { color: var(--fg); }
.panel h3 { font-size: 15px; margin: 0 0 4px; font-family: var(--mono); font-weight: 600;
            overflow-wrap: anywhere; }
.panel h3 .dir { color: var(--muted); font-weight: 400; }
.panel .why-item { display: block; width: 100%; text-align: left; font: inherit;
                   background: none; border: 0; border-top: 1px solid var(--line);
                   padding: 10px 0; cursor: pointer; color: var(--fg); }
.panel .why-item:hover { color: var(--accent); }
.panel .why-item .meta { display: block; font-size: 12px; color: var(--muted); }
.panel .why-item .text { display: block; overflow: hidden; white-space: nowrap;
                         text-overflow: ellipsis; font-size: 13px; }
.explain { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
           padding: 12px 14px; margin: 14px 0; }
.explain .by { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.diff { font-family: var(--mono); font-size: 12px; line-height: 1.5; border: 1px solid var(--line);
        border-radius: 6px; overflow-x: auto; padding: 8px 0; margin-bottom: 14px; }
.diff div { white-space: pre; padding: 0 12px; }
.diff .hunk { color: var(--muted); padding-top: 6px; }
.diff .plus { color: var(--add); }
.diff .minus { color: var(--del); }
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <section id="bands" class="bands"></section>
  <h2>Timeline</h2>
  <section id="timeline"></section>
  <p id="empty" class="muted" hidden>Nothing matches the filters.</p>
</div>
<aside id="panel" class="panel" hidden aria-label="File detail"></aside>

<script type="application/json" id="graphene-data">__GRAPHENE_DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("graphene-data").textContent);
  var D = DATA.debrief;
  var NODES = DATA.nodes;

  function ofType(type) {
    return NODES.filter(function (n) { return n.type === type; });
  }
  var SESSIONS = ofType("session");
  var PROMPT_NODES = ofType("prompt");
  var FILE_NODES = {};
  ofType("file").forEach(function (n) { FILE_NODES[n.path] = n; });

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }
  function add(parent, tag, cls, text) {
    var node = el(tag, cls, text);
    parent.appendChild(node);
    return node;
  }
  function stamp(value) {
    return value ? String(value).slice(0, 16).replace("T", " ") : "?";
  }
  function duration(seconds) {
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    return hours ? hours + "h " + String(minutes).padStart(2, "0") + "m" : minutes + "m";
  }
  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }
  function splitPath(path) {
    var cut = path.lastIndexOf("/");
    return cut === -1 ? ["", path] : [path.slice(0, cut + 1), path.slice(cut + 1)];
  }
  /* A file chip, and the panel heading, name their directory as its own node. */
  function pathInto(parent, path) {
    var parts = splitPath(path);
    if (parts[0]) {
      var dir = add(parent, "span", "dir", parts[0]);
      dir.dataset.node = "dir";
      dir.dataset.path = parts[0].slice(0, -1);
    }
    add(parent, "span", "name", parts[1]);
  }

  /* header ------------------------------------------------------------- */
  function failureLine() {
    var summary = D.failure_summary || {};
    if (!summary.total) { return ""; }
    var byTool = Object.keys(summary.by_tool || {}).map(function (tool) {
      return summary.by_tool[tool] + " " + tool;
    }).join(", ");
    var line = plural(summary.total, "tool failure") + (byTool ? " (" + byTool + ")" : "");
    return summary.denials ? line + "; " + summary.denials + " refused before running" : line;
  }

  function renderHead() {
    var head = document.getElementById("head");
    add(head, "h1", null, "Graphene debrief");
    var ids = D.sessions.map(function (s) { return s.id.slice(0, 8); }).join(", ") || "none";
    var span = D.sessions.length
      ? stamp(D.sessions[0].started_at) + " → " + stamp(D.sessions[D.sessions.length - 1].ended_at)
      : "";
    add(head, "p", "sub", plural(D.sessions.length, "session") + " (" + ids + ") " + span);

    var totals = add(head, "p", "totals");
    add(totals, "span", "big", plural(D.files_changed, "file") + " changed");
    add(totals, "span", "big add", "+" + D.added);
    add(totals, "span", "big del", "−" + D.removed);
    add(totals, "span", "sep", "·");
    add(totals, "span", "muted", plural(D.prompt_count, "prompt") + " · " + duration(D.wall_seconds));

    var failures = failureLine();
    if (failures) { add(head, "p", "fail", failures); }

    var commits = add(head, "details", "commits");
    add(commits, "summary", null, plural(D.commits.length, "commit") + " during the sessions");
    var list = add(commits, "ul");
    D.commits.forEach(function (commit) { add(list, "li", null, commit); });

    var filters = add(head, "div", "filters");
    filters.appendChild(checkbox("unrequested", "unrequested only"));
    filters.appendChild(checkbox("abandoned", "abandoned only"));
    add(filters, "span", "count").id = "shown";
  }

  function checkbox(key, label) {
    var wrap = el("label");
    var box = add(wrap, "input");
    box.type = "checkbox";
    box.dataset.filter = key;
    box.addEventListener("change", applyFilters);
    add(wrap, "span", null, label);
    return wrap;
  }

  function renderBands() {
    var bands = document.getElementById("bands");
    SESSIONS.forEach(function (session) {
      var band = add(bands, "div", "band");
      band.dataset.node = "session";
      band.dataset.id = session.session_id;
      add(band, "span", "band-id", session.label);
      add(band, "span", "band-line",
        stamp(session.started_at) + " → " + stamp(session.ended_at));
      add(band, "span", "band-line", duration(session.wall_seconds) + " · "
        + plural(session.prompts, "prompt") + " · " + plural(session.files, "file")
        + " · " + session.source);
    });
  }

  /* timeline ----------------------------------------------------------- */
  function renderTimeline() {
    var timeline = document.getElementById("timeline");
    D.prompts.forEach(function (prompt, index) {
      var node = PROMPT_NODES[index] || {};
      var row = add(timeline, "article", "row");
      row.dataset.node = "prompt";
      row.dataset.index = String(index);
      row.id = "prompt-" + index;
      if (node.unrequested || node.abandoned) { row.classList.add("has-flag"); }

      var head = add(row, "div", "row-head");
      add(head, "span", "ord", prompt.ordinal ? "Prompt " + prompt.ordinal : "Before prompt 1");
      add(head, "span", null, stamp(prompt.timestamp));
      if (D.sessions.length > 1) {
        add(head, "span", null, "session " + prompt.session_id.slice(0, 8));
      }

      var text = add(row, "p", "prompt-text", prompt.text.trim());
      text.addEventListener("click", function () { text.classList.toggle("open"); });

      var files = add(row, "div", "files");
      if (!prompt.files.length) {
        add(files, "span", "muted", "no file changes");
      }
      prompt.files.forEach(function (file, position) {
        files.appendChild(chip(file, index, position));
      });
    });
  }

  function chip(file, promptIndex, position) {
    var button = el("button", "chip");
    button.type = "button";
    button.dataset.node = "file";
    button.dataset.path = file.path;
    pathInto(button, file.path);
    add(button, "span", "effect", file.effect);
    if (file.added) { add(button, "span", "add", "+" + file.added); }
    if (file.removed) { add(button, "span", "del", "−" + file.removed); }
    if (file.unrequested) { add(button, "span", "flag", "unrequested"); }
    button.addEventListener("click", function () { openPanel(promptIndex, position); });
    return button;
  }

  /* filters ------------------------------------------------------------ */
  function applyFilters() {
    var wanted = {};
    document.querySelectorAll("[data-filter]").forEach(function (box) {
      wanted[box.dataset.filter] = box.checked;
    });
    var shown = 0;
    document.querySelectorAll(".row").forEach(function (row) {
      var node = PROMPT_NODES[Number(row.dataset.index)] || {};
      var hide = (wanted.unrequested && !node.unrequested)
        || (wanted.abandoned && !node.abandoned);
      row.hidden = hide;
      if (!hide) { shown += 1; }
    });
    document.getElementById("shown").textContent =
      shown === D.prompts.length ? "" : shown + " of " + D.prompts.length + " prompts";
    document.getElementById("empty").hidden = shown > 0;
  }

  /* panel -------------------------------------------------------------- */
  var panel = document.getElementById("panel");

  function closePanel() {
    panel.hidden = true;
    panel.replaceChildren();
    document.body.classList.remove("panel-open");
  }

  function openPanel(promptIndex, position) {
    var prompt = D.prompts[promptIndex];
    var file = prompt.files[position];
    panel.replaceChildren();

    var close = add(panel, "button", "close", "Close (Esc)");
    close.type = "button";
    close.addEventListener("click", closePanel);

    var heading = add(panel, "h3");
    heading.dataset.node = "file";
    heading.dataset.path = file.path;
    pathInto(heading, file.path);

    var summary = add(panel, "p", "sub");
    add(summary, "span", null, file.effect + " under "
      + (prompt.ordinal ? "prompt " + prompt.ordinal : "the session start")
      + " · " + stamp(prompt.timestamp));
    if (file.added || file.removed) {
      add(summary, "span", null, " · ");
      add(summary, "span", "add", "+" + file.added);
      add(summary, "span", null, " ");
      add(summary, "span", "del", "−" + file.removed);
    }
    if (file.unrequested) { add(summary, "span", "flag", " · unrequested"); }

    var explain = add(panel, "div", "explain");
    add(explain, "span", null, file.explanation);
    add(explain, "span", "by", file.explained_by === "none"
      ? "explained from the diff (no model)"
      : "explained by " + file.explained_by);

    renderDiff(file);
    renderWhy(file.path, promptIndex);

    panel.hidden = false;
    document.body.classList.add("panel-open");
    panel.scrollTop = 0;
    close.focus();
  }

  function renderDiff(file) {
    var hunks = file.hunks || [];
    if (!hunks.length) {
      add(panel, "p", "muted", file.effect === "reverted"
        ? "The file ended this prompt exactly as it started, so there is no net diff."
        : "No diff was recorded for this change (strategy: " + file.strategy + ").");
      return;
    }
    var diff = add(panel, "div", "diff");
    hunks.forEach(function (hunk) {
      add(diff, "div", "hunk", "@@ -" + hunk.old_start + "," + hunk.old_lines
        + " +" + hunk.new_start + "," + hunk.new_lines + " @@");
      hunk.lines.forEach(function (line) {
        var cls = line.charAt(0) === "+" ? "plus" : (line.charAt(0) === "-" ? "minus" : "");
        add(diff, "div", cls, line);
      });
    });
  }

  /* Why: every prompt in this record that touched the same path, newest first. */
  function renderWhy(path, currentIndex) {
    var entries = [];
    D.prompts.forEach(function (prompt, index) {
      prompt.files.forEach(function (file) {
        if (file.path === path) { entries.push({ prompt: prompt, file: file, index: index }); }
      });
    });
    entries.reverse();
    var node = FILE_NODES[path] || {};
    add(panel, "h2", null, "Why this file looks like this");
    add(panel, "p", "sub", plural(entries.length, "prompt") + " touched it here · net "
      + (node.effect || "modified") + " +" + (node.added || 0) + "/−" + (node.removed || 0));
    entries.forEach(function (entry) {
      var item = add(panel, "button", "why-item");
      item.type = "button";
      item.dataset.node = "prompt";
      add(item, "span", "meta", (entry.prompt.ordinal ? "prompt " + entry.prompt.ordinal
        : "before prompt 1") + " · " + stamp(entry.prompt.timestamp) + " · "
        + entry.file.effect + " +" + entry.file.added + "/−" + entry.file.removed
        + (entry.index === currentIndex ? " · shown above" : ""));
      add(item, "span", "text", entry.prompt.text.trim().split("\n")[0]);
      item.addEventListener("click", function () { jumpTo(entry.index); });
    });
  }

  function jumpTo(index) {
    var row = document.getElementById("prompt-" + index);
    if (!row) { return; }
    row.hidden = false;
    row.scrollIntoView({ block: "center" });
    row.classList.add("flash");
    setTimeout(function () { row.classList.remove("flash"); }, 1200);
  }

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !panel.hidden) { closePanel(); }
  });

  renderHead();
  renderBands();
  renderTimeline();
  applyFilters();
})();
</script>
</body>
</html>
