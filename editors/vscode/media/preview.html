<!doctype html>
<!-- The graph with a fixture state and no VS Code: `npm run build`, then open this file (?fixture=auto,
     ?fixture=proposals, ?fixture=empty, ?fixture=race; running is the default). &theme=light or &theme=hc,
     &view=lanes|graph, &dir=down|across forces the graph's direction, &replay=1 marks the store a replay's,
     &select=ID opens a task's details. The extension's HTML is the same shell. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphene graph preview</title>
  <link rel="stylesheet" href="graph.css">
  <style>
    :root { color-scheme: dark; --vscode-editor-background: #1f1f1f; --vscode-foreground: #cccccc;
            --vscode-descriptionForeground: #9d9d9d; --vscode-editorWidget-background: #202020;
            --vscode-widget-border: #313131; --vscode-focusBorder: #0078d4; --vscode-button-background: #0078d4;
            --vscode-button-foreground: #ffffff; --vscode-button-secondaryBackground: #313131;
            --vscode-button-secondaryForeground: #cccccc; --vscode-button-secondaryHoverBackground: #3c3c3c;
            --vscode-charts-yellow: #cca700; --vscode-charts-purple: #b180d7; --vscode-charts-red: #f14c4c;
            --vscode-charts-blue: #3794ff; --vscode-charts-green: #89d185; --vscode-font-family: -apple-system, system-ui, sans-serif;
            --vscode-editor-font-family: Menlo, monospace; --vscode-editor-inactiveSelectionBackground: #3a3d4133;
            --vscode-sideBar-background: #181818; --vscode-list-hoverBackground: #2a2d2e; --vscode-list-activeSelectionBackground: #04395e;
            --vscode-errorForeground: #f88070; --vscode-textLink-foreground: #4daafc; }
    /* ?theme=light: the Light Modern theme's values */
    :root.light { color-scheme: light; --vscode-editor-background: #ffffff; --vscode-foreground: #3b3b3b;
            --vscode-descriptionForeground: #717171; --vscode-editorWidget-background: #f8f8f8;
            --vscode-widget-border: #e5e5e5; --vscode-focusBorder: #005fb8; --vscode-button-background: #005fb8;
            --vscode-button-foreground: #ffffff; --vscode-button-secondaryBackground: #e5e5e5;
            --vscode-button-secondaryForeground: #3b3b3b; --vscode-button-secondaryHoverBackground: #cccccc;
            --vscode-charts-yellow: #b89500; --vscode-charts-purple: #652d90;
            --vscode-charts-red: #e51400; --vscode-charts-blue: #007acc; --vscode-charts-green: #388a34;
            --vscode-editor-inactiveSelectionBackground: #e5ebf1; --vscode-sideBar-background: #f8f8f8;
            --vscode-list-hoverBackground: #f2f2f2; --vscode-list-activeSelectionBackground: #e8e8e8; --vscode-errorForeground: #f85149; }
    /* ?theme=hc: the Dark High Contrast theme's values; the body gets vscode-high-contrast as VS Code sets it */
    :root.hc { color-scheme: dark; --vscode-editor-background: #000000; --vscode-foreground: #ffffff;
            --vscode-descriptionForeground: #ffffff; --vscode-editorWidget-background: #000000;
            --vscode-widget-border: #6fc3df; --vscode-contrastBorder: #6fc3df; --vscode-contrastActiveBorder: #f38518;
            --vscode-focusBorder: #f38518; --vscode-button-background: #000000; --vscode-button-foreground: #ffffff;
            --vscode-button-border: #6fc3df; --vscode-button-secondaryBackground: #000000; --vscode-button-secondaryForeground: #ffffff;
            --vscode-charts-yellow: #ffff00; --vscode-charts-purple: #d8a8ff; --vscode-charts-red: #ff6a6a; --vscode-charts-blue: #6fc3df;
            --vscode-charts-green: #89d185; --vscode-editor-inactiveSelectionBackground: transparent; --vscode-sideBar-background: #000000;
            --vscode-list-hoverBackground: transparent; --vscode-errorForeground: #f48771; }
  </style>
</head>
<body>
  <header>
    <div id="replay" hidden></div>
    <div id="goal">Graphene</div>
    <div id="counts"></div>
    <div id="auto" hidden></div>
    <div id="actions"></div>
  </header>
  <main>
    <div id="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="view"><g id="bands"></g><g id="edges"></g><g id="tasks"></g><g id="goalg" class="goal"></g><path id="wire" class="wire"></path></g></svg>
      <div id="lanes" hidden></div>
      <div id="notice" hidden></div>
      <button id="to-goal" class="quiet" hidden></button>
    </div>
    <aside id="details" hidden></aside>
  </main>
  <footer id="hint"></footer>
  <div id="help" hidden></div>
  <script src="../dist/preview.js"></script>
  <script src="../dist/graph.js"></script>
</body>
</html>
