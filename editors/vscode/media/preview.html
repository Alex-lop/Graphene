<!doctype html>
<!-- The graph with a fixture state and no VS Code: `npm run build`, then open this file (?fixture=auto,
     ?fixture=proposals, ?fixture=empty; running is the default). The extension's HTML is the same shell. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphene graph preview</title>
  <link rel="stylesheet" href="graph.css">
  <style>
    :root { color-scheme: dark; --vscode-editor-background: #1e1e1e; --vscode-foreground: #cccccc;
            --vscode-descriptionForeground: #9d9d9d; --vscode-editorWidget-background: #252526;
            --vscode-widget-border: #454545; --vscode-focusBorder: #007fd4; --vscode-button-background: #0e639c;
            --vscode-button-foreground: #ffffff; --vscode-button-secondaryBackground: #3a3d41;
            --vscode-charts-yellow: #cca700; --vscode-charts-purple: #b180d7; --vscode-charts-red: #f14c4c;
            --vscode-charts-blue: #3794ff; --vscode-charts-green: #89d185; --vscode-font-family: -apple-system, system-ui, sans-serif;
            --vscode-editor-font-family: Menlo, monospace; --vscode-editor-inactiveSelectionBackground: #3a3d4133; }
    /* ?theme=light: the Light Modern theme's values */
    :root.light { color-scheme: light; --vscode-editor-background: #ffffff; --vscode-foreground: #3b3b3b;
            --vscode-descriptionForeground: #717171; --vscode-editorWidget-background: #f8f8f8;
            --vscode-widget-border: #e5e5e5; --vscode-focusBorder: #005fb8; --vscode-button-background: #005fb8;
            --vscode-button-foreground: #ffffff; --vscode-button-secondaryBackground: #e5e5e5;
            --vscode-button-secondaryForeground: #3b3b3b; --vscode-charts-yellow: #b89500; --vscode-charts-purple: #652d90;
            --vscode-charts-red: #e51400; --vscode-charts-blue: #007acc; --vscode-charts-green: #388a34;
            --vscode-editor-inactiveSelectionBackground: #e5ebf1; }
  </style>
</head>
<body>
  <header>
    <div id="goal">Graphene</div>
    <div id="counts"></div>
    <div id="auto" hidden></div>
    <div id="actions">
      <button id="b-add" title="graphene node add">Add step…</button>
      <button id="b-run" title="graphene run --parallel 4">Run ready</button>
      <button id="b-auto" title="graphene auto">Auto…</button>
      <button id="b-cockpit" title="graphene watch">Cockpit</button>
    </div>
  </header>
  <main>
    <div id="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="view"></g></svg>
      <div id="notice" hidden></div>
    </div>
    <aside id="details" hidden></aside>
  </main>
  <footer id="hint"></footer>
  <script src="../dist/preview.js"></script>
  <script src="../dist/graph.js"></script>
</body>
</html>
