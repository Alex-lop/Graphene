<!doctype html>
<!-- The graph with a fixture state and no VS Code: `npm run build`, then open this file (?fixture=auto,
     ?fixture=proposals, ?fixture=empty, ?fixture=race; running is the default). &theme=light, hc, cursor (Cursor Dark), midnight (Cursor Dark Midnight) or plus (Default Dark+),
     &view=lanes|graph, &dir=down|across forces the graph's direction, &replay=1 marks the store a replay's,
     &standin=1 a live race against the scripted stand-in, &select=ID opens a task's details. The extension's HTML is the same shell. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphene graph preview</title>
  <link rel="stylesheet" href="preview-themes.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <header>
    <div id="replay" hidden></div>
    <div id="goal">Graphene</div>
    <div id="auto" hidden></div>
    <div id="actions"></div>
  </header>
  <main>
    <div id="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="view"><g id="bands"></g><g id="edges"></g><g id="tasks"></g><g id="goalg" class="goal"></g><path id="wire" class="wire"></path></g></svg>
      <div id="lanes" hidden></div>
      <div id="notice" hidden></div>
    </div>
    <aside id="details" hidden></aside>
  </main>
  <footer id="hint"></footer>
  <div id="help" hidden></div>
  <script>if (/[?&]theme=(cursor|midnight)/.test(location.search)) document.body.dataset.editor = "cursor"; // as the host says of Cursor</script>
  <script src="../dist/preview.js"></script>
  <script src="../dist/graph.js"></script>
</body>
</html>
